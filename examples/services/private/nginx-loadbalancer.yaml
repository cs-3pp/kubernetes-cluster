# Example: nginx exposed on the customer private VLAN via MetalLB.
#
# Apply metallb-customer-vlan.yaml FIRST — and read its header. The app pool
# must not overlap the pool MetalLB already holds for the private API endpoint,
# or nothing gets an address at all.
#
# Verified from a VM on the customer VLAN: HTTP 200 in 6-12 ms, and the VIP was
# allocated ~6 s after the Service was created.
#
#   curl http://10.8.0.6/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: default
  annotations:
    # Modern annotation; metallb.universe.tf/... also still works.
    metallb.io/loadBalancerIPs: 10.8.0.6
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
