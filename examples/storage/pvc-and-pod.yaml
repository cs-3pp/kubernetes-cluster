# Example: persistent storage on a managed Kubernetes cluster.
#
# The CloudSigma CSI driver is installed automatically and creates ONE default
# StorageClass whose name matches the drive tier your account subscribes to —
# `cloudsigma-<tier>`. Check what you have before writing manifests:
#
#   kubectl get storageclass
#
# Because it is the default, `storageClassName` can be omitted entirely; it is
# spelled out here only to show where it goes. Omitting it is the portable
# choice — the tier differs between locations, so a manifest that hardcodes one
# tier will not apply everywhere.
#
# Two behaviours worth knowing before you debug something that is working:
#
#   * volumeBindingMode is WaitForFirstConsumer. A PVC with no Pod using it
#     stays Pending forever, on purpose — the volume is created in the same
#     place the Pod is scheduled. It binds when a Pod mounts it, not before.
#   * volumes are ReadWriteOnce block devices. One node at a time; use one
#     PVC per replica (see statefulset.yaml) rather than sharing a claim.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: cloudsigma-<tier>   # omit to use the default
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: data-writer
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "hello from $(hostname)" > /data/marker
          sync
          cat /data/marker
          df -h /data | tail -1
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
