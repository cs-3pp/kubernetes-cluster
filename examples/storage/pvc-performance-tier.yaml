# Example: a volume on a performance tier.
#
# Where CloudSigma offers storage tiers for your account and location, your
# cluster may have one StorageClass per tier next to the default (see
# README.md, "Performance tiers"). List what yours has first; the names and
# limits below are one location's example and may differ in yours:
#
#   kubectl get storageclass
#
#   cloudsigma-nvme-basic        600 IOPS
#   cloudsigma-nvme (default)    3,000 IOPS
#   cloudsigma-nvme-fast         5,000 IOPS
#   cloudsigma-nvme-super-fast   10,000 IOPS
#
# The CSI driver does not support changing an existing volume's tier;
# resizing keeps it. The claim binds once the Pod below uses it. Check the
# tier then:
#
#   kubectl -n default wait --for=jsonpath='{.status.phase}'=Bound pvc/db-data --timeout=120s
#   kubectl get pv "$(kubectl -n default get pvc db-data -o jsonpath='{.spec.volumeName}')" \
#     -o jsonpath='{.spec.csi.volumeAttributes.storageTier}'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cloudsigma-nvme-fast
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: db-data-writer
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "written on a fast-tier volume" > /data/marker
          sync
          cat /data/marker
          df -h /data | tail -1
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: db-data
