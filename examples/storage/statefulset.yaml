# Example: a StatefulSet with per-replica persistent storage.
#
# This is the shape most real workloads want. volumeClaimTemplates gives every
# replica its OWN volume, which is what ReadWriteOnce block storage supports —
# several replicas cannot share one claim.
#
# Deliberately no storageClassName: the cluster's default StorageClass is used,
# so the same manifest applies in any location regardless of which drive tier
# that account subscribes to.
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: default
spec:
  clusterIP: None          # headless, gives each replica a stable DNS name
  selector:
    app: web
  ports:
    - port: 80
      name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: default
spec:
  serviceName: web
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: content
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
